name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -v

  ts-upload-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/upload-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm test

  ts-agent-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm test
